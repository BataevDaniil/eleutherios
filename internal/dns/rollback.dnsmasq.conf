user=nobody
pid-file=/var/run/opt-dnsmasq.pid

# Слушаем только loopback на стандартном 53 — клиенты в LAN на 127.0.0.1 не ходят,
# поэтому не конфликтуем с NDM (тот сам обслуживает :53 на br0/br1/... через redirect
# в ndnproxy). Этот конфиг — безопасный rollback после остановки eleutherios,
# если оригинальный /opt/etc/dnsmasq.conf был утрачен или уже содержал наш marker.
listen-address=127.0.0.1
port=53

bind-interfaces
no-resolv
no-poll
log-async

server=77.88.8.8#53
conf-dir=/opt/etc/dnsmasq.d/,*.dnsmasq
